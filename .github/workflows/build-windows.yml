name: Build and release Windows desktop app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build/desktop-source.zip.b64'
      - '.github/workflows/build-windows.yml'
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract Windows app source
        shell: pwsh
        run: |
          $encoded=(Get-Content 'build/desktop-source.zip.b64' -Raw).Trim()
          [System.IO.File]::WriteAllBytes('desktop-source.zip',[Convert]::FromBase64String($encoded))
          New-Item -ItemType Directory -Force -Path desktop | Out-Null
          Expand-Archive -LiteralPath desktop-source.zip -DestinationPath desktop -Force
      - name: Install Electron dependencies
        shell: pwsh
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Install official local ChatGPT DevKit
        shell: pwsh
        working-directory: desktop
        run: npm run setup:chatgpt
      - name: Run desktop tests
        shell: pwsh
        working-directory: desktop
        run: npm test
      - name: Verify package
        shell: pwsh
        working-directory: desktop
        run: npm run verify:packaging
      - name: Build Windows installer and update metadata
        shell: pwsh
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win -- --publish never
      - name: Verify release assets
        shell: pwsh
        run: |
          $setup=Get-ChildItem desktop/release -File -Filter '*.exe'
          $manifest=Get-Item desktop/release/latest.yml -ErrorAction Stop
          if(!$setup){throw 'Missing Windows installer'}
          if(!$manifest){throw 'Missing electron-updater latest.yml'}
      - name: Upload Windows installer and update manifest
        uses: actions/upload-artifact@v4
        with:
          name: Devydtz-Workforce-Windows-Installer
          path: |
            desktop/release/*.exe
            desktop/release/latest.yml
            desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 30
      - name: Publish a versioned GitHub Release for automatic updates
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version=node -p "require('./desktop/package.json').version"
          if($LASTEXITCODE -ne 0){throw 'Unable to read package version'}
          $tag="v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -eq 0){Write-Host "$tag already published; skipping duplicate release";exit 0}
          $files=@((Get-ChildItem desktop/release -File | Where-Object { $_.Name -match '\.(exe|blockmap)$' -or $_.Name -eq 'latest.yml' } | ForEach-Object { $_.FullName }))
          if(!$files -or -not ($files | Where-Object { $_ -match 'latest\.yml$' })){throw 'No update manifest for release'}
          gh release create $tag @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Devydtz Workforce $version" --notes "Windows installer and built-in GitHub release updater. The Windows binary is unsigned; verify the official repository before installing." --latest
          if($LASTEXITCODE -ne 0){throw 'Could not publish GitHub Release'}